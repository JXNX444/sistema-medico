<!DOCTYPE html>
<!--
  fragments/layout.html
  Piezas reutilizables del sistema de diseño. Se insertan con th:replace/th:insert.
  Ejemplos de uso:
    <head th:replace="~{fragments/layout :: head('Dashboard', 'usuarios.css')}"></head>
    <div th:replace="~{fragments/layout :: brand('HOSPITAL SAN RAFAEL','')}"></div>
    <aside th:replace="~{fragments/layout :: sidebar('usuarios')}"></aside>
    <header th:replace="~{fragments/layout :: topbar('Usuarios','Mantenimiento de usuarios')}"></header>
-->
<html xmlns:th="http://www.thymeleaf.org">

<!-- ============ HEAD ============ -->
<head th:fragment="head(titulo, pageCss)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Sistema Médico</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <!-- Listas, calendario y avisos con el estilo del sistema (todas las paginas) -->
    <link rel="stylesheet" th:href="@{/css/controles.css}">
    <script th:src="@{/js/controles.js}" defer></script>
    <!-- CSS específico de la página (opcional): pasar el nombre del archivo o null -->
    <link th:if="${pageCss}" rel="stylesheet" th:href="@{'/css/' + ${pageCss}}">
</head>

<body>

<!-- ============ LOGO / MARCA (círculo cian + electro que late) ============ -->
<!-- size: '' | 'sm-logo--sm' | 'sm-logo--lg' -->
<div th:fragment="brand(name, size)" class="sm-logo" th:classappend="${size}">
    <div class="sm-logo__mark">
        <svg width="18" height="18" viewBox="0 0 34 34">
            <polyline points="0,17 8,17 12,7 17,27 22,10 26,17 34,17"
                      fill="none" stroke="#fff" stroke-width="3.5"
                      stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60"/>
        </svg>
    </div>
    <div class="sm-logo__name" th:text="${name}">HOSPITAL SAN RAFAEL</div>
</div>

<!-- Variante oscura (círculo navy + electro cian brillante) para el login de personal -->
<div th:fragment="brandDark(name, size)" class="sm-logo sm-logo--dark" th:classappend="${size}">
    <div class="sm-logo__mark">
        <svg width="18" height="18" viewBox="0 0 34 34">
            <polyline points="0,17 8,17 12,7 17,27 22,10 26,17 34,17"
                      fill="none" stroke="#22D3EE" stroke-width="3"
                      stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60"/>
        </svg>
    </div>
    <div class="sm-logo__name" th:text="${name}">HOSPITAL SAN RAFAEL</div>
</div>

<!-- ============ SIDEBAR (shell del Administrador) ============ -->
<!--
  Solo las opciones que le tocan al Administrador segun los CU:
    Inicio (/panel/inicio), Usuarios [CU-01], Especialidades por Sede [CU-13],
    Catalogos [CU-14] y Bitacora Inventario [CU-15, ajustes].
  Pasar la clave de la seccion activa: 'inicio', 'usuarios', 'sedes', 'catalogos' o 'bitacora'.
-->
<aside th:fragment="sidebar(active)" class="sm-sidebar">
    <div class="sm-sidebar__brand" th:replace="~{fragments/layout :: brand('HOSPITAL SAN RAFAEL','sm-logo--sm')}"></div>

    <a class="sm-nav-item" th:classappend="${active=='inicio'}    ? 'is-active'" th:href="@{/panel/inicio}">Inicio</a>
    <a class="sm-nav-item" th:classappend="${active=='usuarios'}  ? 'is-active'" th:href="@{/usuarios}">Usuarios</a>
    <a class="sm-nav-item" th:classappend="${active=='sedes'}     ? 'is-active'" th:href="@{/sedes-especialidades}">Especialidades por Sede</a>
    <a class="sm-nav-item" th:classappend="${active=='catalogos'} ? 'is-active'" th:href="@{/catalogos}">Catálogos</a>
    <a class="sm-nav-item" th:classappend="${active=='bitacora'}  ? 'is-active'" th:href="@{/bitacora-inventario}">Bitácora Inventario</a>

    <!-- Usuario en sesion + cerrar sesion (POST /logout, como en el panel de inicio) -->
    <div class="sm-sidebar__user">
        <div class="sm-avatar" th:text="${#authentication != null ? #strings.toUpperCase(#strings.substring(#authentication.name,0,1)) : 'A'}">A</div>
        <div>
            <div class="sm-sidebar__user-name" th:text="${#authentication != null ? #authentication.name : 'Administrador'}">Administrador</div>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button type="submit" class="sm-sidebar__user-mail"
                        style="background:none;border:none;padding:0;cursor:pointer;font-family:inherit;">Cerrar sesión</button>
            </form>
        </div>
    </div>
</aside>

<!-- ============ TOPBAR del contenido (título + búsqueda + campana) ============ -->
<header th:fragment="topbar(titulo, sub)" class="sm-topbar">
    <div>
        <div class="sm-topbar__title" th:text="${titulo}">Título</div>
        <div class="sm-topbar__sub"   th:text="${sub}">Subtítulo</div>
    </div>
    <div class="sm-topbar__actions">
        <input class="sm-search" type="text" placeholder="Buscar…">
        <div class="sm-bell">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
        </div>
    </div>
</header>

</body>
</html>
