<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mi Perfil', null)}"></head>
<body>

<nav class="sm-navbar">
    <div th:replace="~{fragments/layout :: brand('HOSPITAL SAN RAFAEL','')}"></div>
    <a th:href="@{/dashboard}" class="sm-btn sm-btn--ghost sm-btn--sm">← Volver a mi panel</a>
</nav>

<main style="max-width:640px;margin:0 auto;padding:40px 24px;">
    <div style="font-size:24px;font-weight:800;">Mi perfil</div>
    <div style="font-size:14px;color:var(--sm-slate-500);margin-bottom:24px;">Revise y actualice sus datos personales</div>

    <div th:if="${param.actualizado}" class="sm-badge sm-badge--success"
         style="display:flex;padding:10px 14px;margin-bottom:16px;font-size:13px;">
        Sus datos se actualizaron correctamente.
    </div>

    <form th:action="@{/perfil}" th:object="${form}" method="post"
          class="sm-panel" style="display:flex;flex-direction:column;gap:14px;">

        <div class="sm-field">
            <label>Nombre completo</label>
            <input class="sm-input" type="text" th:value="${usuario.nombreCompleto}" disabled
                   style="background:var(--sm-line);color:var(--sm-slate-500);">
        </div>

        <div class="sm-field">
            <label>Nombre de usuario</label>
            <input class="sm-input" type="text" th:value="${usuario.username}" disabled
                   style="background:var(--sm-line);color:var(--sm-slate-500);">
        </div>

        <div class="sm-field">
            <label>Correo electrónico</label>
            <input class="sm-input" type="email" th:field="*{correo}">
            <p class="sm-error" th:if="${errores.get('correo')} != null" th:text="${errores.get('correo')}"></p>
        </div>

        <div class="sm-field">
            <label>Número de teléfono (opcional)</label>
            <input class="sm-input" type="text" th:field="*{telefono}" maxlength="8">
            <p class="sm-error" th:if="${errores.get('telefono')} != null" th:text="${errores.get('telefono')}"></p>
        </div>

        <div style="border-top:1px solid var(--sm-border);margin-top:8px;padding-top:16px;">
            <div style="font-size:16px;font-weight:700;">Cambiar contraseña (opcional)</div>
            <div style="font-size:13px;color:var(--sm-slate-500);">Deje estos campos en blanco si no desea cambiarla.</div>
        </div>

        <div class="sm-field">
            <label>Contraseña actual</label>
            <input class="sm-input" type="password" th:field="*{passwordActual}" autocomplete="off">
            <p class="sm-error" th:if="${errores.get('passwordActual')} != null" th:text="${errores.get('passwordActual')}"></p>
        </div>

        <div class="sm-field">
            <label>Nueva contraseña</label>
            <input class="sm-input" type="password" th:field="*{passwordNueva}" autocomplete="off">
            <p class="sm-error" th:if="${errores.get('passwordNueva')} != null" th:text="${errores.get('passwordNueva')}"></p>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:8px;">
            <a th:href="@{/dashboard}" class="sm-btn sm-btn--ghost">Cancelar</a>
            <button type="submit" class="sm-btn sm-btn--primary">Guardar cambios</button>
        </div>
    </form>
</main>

</body>
</html>
