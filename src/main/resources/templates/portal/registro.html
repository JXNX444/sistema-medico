<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro de Paciente', null)}"></head>
<body>

<div class="sm-auth-wrap">
    <div class="sm-card" style="width:860px;max-width:100%;display:flex;">

        <!-- Panel navy izquierdo -->
        <div style="width:320px;flex-shrink:0;background:var(--sm-ink);padding:40px 36px;
                display:flex;flex-direction:column;gap:16px;">
            <a th:href="@{/}" style="font-size:13px;color:var(--sm-slate-300);"
               onclick="return confirm('¿Deseas cancelar el registro? Los datos ingresados se perderán.');">← Volver al portal</a>
            <div th:replace="~{fragments/layout :: brand('HOSPITAL SAN RAFAEL','sm-logo--lg')}"
                 style="flex-direction:column;"></div>
            <div style="font-size:22px;font-weight:800;color:#fff;line-height:1.2;">Cree su cuenta</div>
            <div style="font-size:13px;color:var(--sm-slate-400);line-height:1.6;">
                Regístrese como paciente para agendar y consultar sus citas médicas.
            </div>
        </div>

        <!-- Formulario -->
        <div style="flex:1;padding:36px 40px;min-width:0;">
            <div style="font-size:20px;font-weight:800;">Registro de paciente</div>
            <div style="font-size:13px;color:var(--sm-slate-500);margin-bottom:20px;">Complete sus datos para crear su cuenta</div>

            <div th:if="${errores.get('general')}" class="sm-badge sm-badge--danger"
                 style="display:flex;padding:10px 14px;margin-bottom:16px;font-size:13px;"
                 th:text="${errores.get('general')}"></div>

            <form th:action="@{/registro}" method="post" th:object="${form}"
                  style="display:flex;flex-direction:column;gap:14px;">

                <div class="sm-field">
                    <label for="nombreCompleto">Nombre completo</label>
                    <input class="sm-input" type="text" id="nombreCompleto" th:field="*{nombreCompleto}" placeholder="Nombres y apellidos">
                    <p class="sm-error" th:if="${errores.get('nombreCompleto')}" th:text="${errores.get('nombreCompleto')}"></p>
                </div>

                <div class="sm-field">
                    <label for="dpi">DPI</label>
                    <input class="sm-input" type="text" id="dpi" th:field="*{dpi}" maxlength="13" inputmode="numeric" placeholder="13 dígitos">
                    <p class="sm-error" th:if="${errores.get('dpi')}" th:text="${errores.get('dpi')}"></p>
                </div>

                <div class="sm-field">
                    <label for="nit">NIT</label>
                    <input class="sm-input" type="text" id="nit" th:field="*{nit}" maxlength="9" inputmode="numeric" placeholder="8 a 9 dígitos">
                    <p class="sm-error" th:if="${errores.get('nit')}" th:text="${errores.get('nit')}"></p>
                </div>

                <div class="sm-field">
                    <label for="telefono">Teléfono</label>
                    <input class="sm-input" type="text" id="telefono" th:field="*{telefono}" maxlength="8" inputmode="numeric" placeholder="8 dígitos">
                    <p class="sm-error" th:if="${errores.get('telefono')}" th:text="${errores.get('telefono')}"></p>
                </div>

                <div class="sm-field">
                    <label for="numeroSeguro">Número de afiliado del seguro <span style="color:var(--sm-slate-400);font-weight:400;">(opcional)</span></label>
                    <input class="sm-input" type="text" id="numeroSeguro" th:field="*{numeroSeguro}" maxlength="50" placeholder="Solo si aplica">
                    <p class="sm-error" th:if="${errores.get('numeroSeguro')}" th:text="${errores.get('numeroSeguro')}"></p>
                </div>

                <div class="sm-field">
                    <label for="correo">Correo electrónico</label>
                    <input class="sm-input" type="text" id="correo" th:field="*{correo}" placeholder="usuario@dominio.com" autocomplete="off">
                    <p class="sm-error" th:if="${errores.get('correo')}" th:text="${errores.get('correo')}"></p>
                </div>

                <div class="sm-field">
                    <label for="username">Nombre de usuario</label>
                    <input class="sm-input" type="text" id="username" th:field="*{username}" maxlength="9" placeholder="8 a 9 caracteres" autocomplete="off">
                    <p class="sm-error" th:if="${errores.get('username')}" th:text="${errores.get('username')}"></p>
                </div>

                <div class="sm-field">
                    <label for="password">Contraseña</label>
                    <input class="sm-input" type="password" id="password" th:field="*{password}" placeholder="Mínimo 12 caracteres">
                    <p class="sm-error" th:if="${errores.get('password')}" th:text="${errores.get('password')}"></p>
                </div>

                <button type="submit" class="sm-btn sm-btn--primary sm-btn--block" style="margin-top:6px;">Registrarse</button>
            </form>

            <div style="text-align:center;margin-top:16px;">
                <a th:href="@{/login}" style="font-size:13px;">Ya tengo cuenta, iniciar sesión</a>
            </div>
        </div>

    </div>
</div>

<script>
    function soloDigitos(input){ input.addEventListener('input', function(){ this.value = this.value.replace(/[^0-9]/g,''); }); }
    function soloAlfanumerico(input){ input.addEventListener('input', function(){ this.value = this.value.replace(/[^A-Za-z0-9]/g,''); }); }
    soloDigitos(document.getElementById('dpi'));
    soloDigitos(document.getElementById('telefono'));
    soloDigitos(document.getElementById('nit'));
    soloAlfanumerico(document.getElementById('username'));
</script>

</body>
</html>
